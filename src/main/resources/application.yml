server:
  port: ${PORT:8080}

spring:
  application:
    name: smarthire-backend
  datasource:
    url: ${MYSQL_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smarthiredb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${MYSQL_USER:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

smarthire:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  github:
    client-id: ${GITHUB_CLIENT_ID:Ov23liSampleClientId}
    client-secret: ${GITHUB_CLIENT_SECRET:sampleClientSecretKey}
    callback-url: ${GITHUB_CALLBACK_URL:http://localhost:5173/student/github}
  ai:
    provider: ${AI_PROVIDER:gemini} # heuristic, openai, or gemini
    api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
